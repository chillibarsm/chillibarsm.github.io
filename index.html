<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chilli Bar | Sitio Oficial</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin: 20px 0;
        }
        .header h1 {
            color: #ff4500;
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }
        .header p {
            color: #888;
            margin: 5px 0 0 0;
            font-size: 1.1rem;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #161616;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            border: 1px solid #262626;
            box-sizing: border-box;
        }
        .title {
            color: #ff5500;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.3rem;
            text-align: center;
            letter-spacing: 1px;
        }
        .player-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .player-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- CABECERA DEL BAR -->
    <div class="header">
        <h1>CHILLI BAR</h1>
        <p>San Marcos</p>
    </div>

    <!-- RADIO ONLINE ESTABLE DE YOUTUBE LIVE -->
    <div class="card">
        <div class="title">📻 RADIO CHILLI MIX</div>
        <div class="player-box">
            <!-- Transmisión oficial en vivo 24/7 de Deep House sin anuncios -->
            <iframe 
                src="https://youtube.com" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
