<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chilli Bar | Sitio Oficial</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin: 20px 0;
        }
        .header h1 {
            color: #ff4500;
            font-size: 2.8rem;
            margin: 0;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }
        .header p {
            color: #888;
            margin: 5px 0 0 0;
            font-size: 1.1rem;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: #161616;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            border: 1px solid #262626;
            box-sizing: border-box;
        }
        .title {
            color: #ff5500;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.3rem;
            text-align: center;
            letter-spacing: 1px;
        }
        .player-box {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- CABECERA DEL BAR -->
    <div class="header">
        <h1>CHILLI BAR</h1>
        <p>San Marcos</p>
    </div>

    <!-- REPRODUCTOR SIN PUBLICIDADES -->
    <div class="card">
        <div class="title">📻 RADIO CHILLI MIX</div>
        <div class="player-box">
            <p style="color: #00ffcc; font-weight: bold; margin: 0; font-size: 14px; letter-spacing: 1px;">• MÚSICA CONTINUA SIN ANUNCIOS</p>
            <!-- Stream directo de música Deep House libre de locutores -->
            <audio controls src="https://torontocast.com">
                Tu navegador no soporta este reproductor.
            </audio>
        </div>
    </div>

</body>
</html>
